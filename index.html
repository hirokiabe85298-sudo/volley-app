<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="バレー分析"><meta name="theme-color" content="#1b2230"><title>バレー試合分析</title><style id="css">
:root{--bg:#f3f4f6;--card:#fff;--ink:#1b2230;--sub:#667085;--line:#e2e5ea;--pri:#1f5fd1;--good:#11804c;--goodbg:#e6f5ec;--bad:#c4372c;--badbg:#fbeceb;--court:#f0c48a;--courtd:#e3a960}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:6}
header{background:var(--ink);color:#fff;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));display:flex;align-items:center;gap:8px;min-height:48px}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
header select{font-size:14px;padding:5px 6px;border-radius:8px;border:0}
.st{font-size:12px;padding:6px 10px;border-radius:8px;border:0;white-space:nowrap}
.st.dirty{background:#f2a33a;color:#1b2230;font-weight:700}
.st.ok{background:transparent;color:#9fb1cc}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:11px 4px;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;font-family:inherit}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{padding:10px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));max-width:960px;margin:0 auto 80px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-size:15px;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.btn.red{color:var(--bad);border-color:#efc4c0}
.btn.sm{padding:6px 9px;font-size:13px;border-radius:8px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
label.f{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;color:var(--ink)}
input.w{width:100%}
.muted{color:var(--sub);font-size:13px}
.score{display:flex;align-items:center;justify-content:space-between;gap:8px}
.score .big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.score .big span{color:var(--sub);font-weight:400;margin:0 6px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:700}
.pill.s{background:var(--goodbg);color:var(--good)}
.pill.r{background:#e8eefb;color:var(--pri)}
.court{background:var(--court);border:3px solid #fff;outline:2px solid var(--courtd);border-radius:6px;padding:0 6px 6px;max-width:420px;margin:0 auto}
.court .net{height:16px;margin:0 -6px 6px;background:repeating-linear-gradient(90deg,#1b2230 0 2px,#3a4357 2px 6px);color:#fff;font-size:10px;text-align:center;line-height:16px;letter-spacing:4px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cg .front{border-bottom:0}
.cl{grid-column:1/-1;height:0;border-top:2px dashed #fff;margin:0 -6px}
.cell{position:relative;background:rgba(255,255,255,.92);border:2px solid transparent;border-radius:10px;padding:8px 2px 6px;text-align:center;font-family:inherit;color:var(--ink);min-height:62px;width:100%}
button.cell{cursor:pointer}
.cell.on{border-color:var(--pri);background:#dfe9fd}
.cell.out{border-color:var(--bad);background:var(--badbg)}
.cell b{display:block;font-size:22px;line-height:1.05}
.cell small{display:block;font-size:11px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell .ps{position:absolute;top:2px;left:5px;font-size:10px;color:var(--sub)}
.cell .tg{position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;color:#fff;background:var(--pri);border-radius:4px;padding:0 3px}
.cell .sv{position:absolute;bottom:2px;right:4px;font-size:12px}
.cell select{width:100%;font-size:14px;padding:4px 2px;margin-top:2px}
.court.sm{padding:0 3px 3px;border-width:2px}
.court.sm .net{height:8px;margin:0 -3px 3px;font-size:0}
.court.sm .cg{gap:3px}
.court.sm .cell{min-height:0;padding:3px 1px;border-radius:6px}
.court.sm .cell b{font-size:14px}
.court.sm .cell small{font-size:9px}
.court.sm .cell .ps,.court.sm .cell .sv{display:none}
.court.sm .cell .tg{font-size:8px;top:1px;right:1px}
.rots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rots .lab{font-size:13px;font-weight:700;margin-bottom:3px;text-align:center}
.libs{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.libs .cell{width:auto;min-width:70px;min-height:0;padding:5px 8px;border-color:#f2a33a}
.libs .cell.on{border-color:var(--pri)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.pb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;text-align:center;font-family:inherit;color:var(--ink);cursor:pointer}
.pb b{display:block;font-size:20px;line-height:1.1}
.pb small{display:block;font-size:11px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb.on{border-color:var(--pri);background:#e8eefb}
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.skills button{padding:12px 2px;font-size:14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.skills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-top:10px}
.res button,.tmb button{padding:16px 4px;font-size:16px;font-weight:700;border-radius:10px;border:0;font-family:inherit;cursor:pointer}
.res .p,.tmb .p{background:var(--good);color:#fff}
.res .z{background:#e9ecf1;color:var(--ink)}
.res .m,.tmb .m{background:var(--bad);color:#fff}
.tmb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.banner{background:#fff3e0;border:1px solid #f2c27a;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:6px}
.log li:last-child{border:0}
.log .pt{margin-left:auto;font-weight:700}
.plus{color:var(--good)}.minus{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi .n{font-size:12px;color:var(--sub)}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .t{font-size:12px}
.kpi.good{background:var(--goodbg);border-color:#bfe3cd}.kpi.good .t{color:var(--good)}
.kpi.bad{background:var(--badbg);border-color:#f0c9c5}.kpi.bad .t{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right}
th{background:#f7f8fa;color:var(--sub);font-weight:600}
td.l,th.l{text-align:left}
tr.grp th{background:#eef1f5;text-align:center;color:var(--ink)}
.good-t{color:var(--good);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;z-index:20;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:360px;width:100%}
#modal p{margin:0 0 14px;line-height:1.6}
textarea{width:100%;min-height:120px;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.note{background:#fff8e6;border:1px solid #f1dca8;border-radius:10px;padding:10px;font-size:13px;line-height:1.6}
.sets{font-size:13px;color:var(--sub);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.sidesw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sidesw button{padding:10px;font-size:15px;font-weight:700;border-radius:10px;border:2px solid var(--line);background:#fff;font-family:inherit;color:var(--ink)}
.sidesw button.on.u{background:var(--pri);border-color:var(--pri);color:#fff}
.sidesw button.on.o{background:#7a3db8;border-color:#7a3db8;color:#fff}
.card.oppmode{box-shadow:0 0 0 2px #7a3db8 inset}
.court.opp{background:#cdb8e8;outline-color:#a98bd3}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--sub);font-weight:600}
.chip.live{background:#fff1dc;color:#a35b00}.chip.sh{background:#e8eefb;color:var(--pri)}
.mrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.miss{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-top:8px}
.miss button{padding:12px 4px;font-size:14px;font-weight:700;border-radius:10px;border:2px solid var(--bad);background:var(--badbg);color:var(--bad);font-family:inherit}
.skills.six{grid-template-columns:repeat(3,1fr)}
.etab td{font-size:12px}
.tagU{color:var(--pri);font-weight:700}.tagO{color:#7a3db8;font-weight:700}
.cell input{width:100%;text-align:center;font-size:16px;padding:6px 2px;margin-top:2px}
.crit{font-size:13px;line-height:1.7}
.crit b{display:inline-block;min-width:3.5em}
.fc{border:3px solid #fff;outline:2px solid var(--courtd);border-radius:6px;overflow:hidden;max-width:440px;margin:0 auto}
.fc .net{height:16px;background:repeating-linear-gradient(90deg,#1b2230 0 2px,#3a4357 2px 6px);color:#fff;font-size:10px;text-align:center;line-height:16px;letter-spacing:4px}
.half{padding:4px 6px 6px}
.half.hu{background:var(--court)}
.half.ho{background:#cdb8e8}
.half .hl{font-size:11px;font-weight:700;color:#3a4357;margin:0 0 3px}
.half .cg{gap:5px}
.half .cl{border-top:2px dashed #fff;margin:5px -6px}
.half .cell{min-height:52px;padding:6px 2px 4px}
.half .cell b{font-size:20px}
.half.nolu .pgrid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.fc .libs{margin:0;padding:4px 6px;background:rgba(255,255,255,.5)}
.cell.lib{width:auto;min-width:64px;min-height:0;padding:4px 8px;border-color:#f2a33a}
.cell.lib b{font-size:16px}
.chip.pr{background:#e6f5ec;color:var(--good)}
.adj .btn{padding:6px 8px;font-size:12px}
#vbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.08);display:none}
#vbar .vrow{display:flex;gap:6px;max-width:960px;margin:0 auto}
#vbar input{flex:1;min-width:0;font-size:16px;padding:9px 10px}
#vbar .btn{white-space:nowrap}
#vbar #vmic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
#vmsg{font-size:12px;color:var(--good);max-width:960px;margin:0 auto 4px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vmsg.bad{color:var(--bad)}
.skills.sz-l button{padding:18px 2px;font-size:16px}

.dockin{max-width:600px;margin:0 auto}
body.recmode header{display:none}
body.recmode main{padding-top:6px;margin-bottom:0}
body.recmode #toast{bottom:auto;top:110px}
.sbar{display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}

.fc.rec{margin-bottom:6px}

.pgrid.prac{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));margin-bottom:6px}
.log.mini{background:#fff;border-radius:10px;padding:2px 10px;margin:0 0 10px;font-size:12px}
.log.mini li{padding:4px 0}
.dsel{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub);margin:0 0 5px;min-height:24px}
.dsel .btn.sm{padding:3px 8px;font-size:12px}
#dock .skills{margin-top:0;gap:5px}
#dock .skills button{padding:9px 2px;font-size:13px;border-radius:9px}

all=all.filter(function(e){return!del[e.id]});all.forEach(function(e){if(upd[e.id])for(var k in upd[e.id])e[k]=upd[e.id][k]});

m.sets.forEach(function(s){s.events=[]});

function blank(){var c={};for(var k in RES){c[k]={n:0};RES[k].forEach(function(x){c[k][x.k]=0})}return c}
function agg(ms,side,pid){side=side||'U';var T={c:blank(),pl:{},rot:{},so:[0,0],br:[0,0],sets:0,us:0,th:0,miss:{}};
for(var r=1;r<=6;r++)T.rot[r]={w:0,l:0,so:[0,0],br:[0,0]};
ms.forEach(function(m){m.sets.forEach(function(s){setState(s);if(!s.events.some(function(e){return e.sk!=='ADJ'&&e.sk!=='SUB'}))return;T.sets++;
s.events.forEach(function(e){if(e.sk==='ADJ'||e.sk==='SUB')return;
var op=ourPt(e),pp=side==='U'?op:-op,sv=side==='U'?e.sv:!e.sv,rt=side==='U'?e.rot:e.orot;
if(pp!==0){var R=T.rot[rt]||T.rot[1];if(pp>0){T.us++;R.w++}else{T.th++;R.l++}
var a=sv?'br':'so';T[a][1]++;R[a][1]++;if(pp>0){T[a][0]++;R[a][0]++}}
if(e.sk==='TM')return;if((e.side||'U')!==side)return;if(pid&&e.p!==pid)return;
var C=T.c[e.sk];if(!C)return;C.n++;C[e.r]=(C[e.r]||0)+1;
if(e.r==='ミス'){var mk=e.sk+'|'+(e.mt||'種類なし');T.miss[mk]=(T.miss[mk]||0)+1}
if(e.p){var P=T.pl[e.p]||(T.pl[e.p]=blank());P[e.sk].n++;P[e.sk][e.r]=(P[e.sk][e.r]||0)+1}})})});return T}
